[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "samf-module-demo"
version = "0.1.0"
description = "Selected SAMF-related encoder and predictor modules with synthetic forward demonstrations"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["torch>=2.0,<3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["samf_modules*"]
